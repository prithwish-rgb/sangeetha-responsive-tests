name: Smoke Regression (Mobile)

on:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run in headless mode'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: regression-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-regression:
    name: Execute Smoke Regression Tier
    runs-on: [self-hosted, windows, x64, sangeetha-qa]
    timeout-minutes: 45

    env:
      CI: 'true'
      VIEWPORT_WIDTH: '393'
      VIEWPORT_HEIGHT: '851'
      HEADLESS: 'true'
      AUTH_STATE_JSON: ${{ secrets.AUTH_STATE_JSON }}
      AUTH_STATE_BASE64: ${{ secrets.AUTH_STATE_BASE64 }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        shell: powershell
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm ci failed; falling back to npm install"
            npm install
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: 🌐 Install Playwright Chromium Browser
        run: npx playwright install chromium

      - name: 🌐 Verify Production Reachability From QA Runner
        run: node -e "fetch('https://www.sangeetha.com/').then(async r => { console.log('Production HTTP status:', r.status); console.log('Production server:', r.headers.get('server') || 'unknown'); if (r.status !== 200) { throw new Error('Production site returned HTTP ' + r.status); } }).catch(e => { console.error(e); process.exit(1); })"

      - name: 🔑 Initialize Stored Authentication Session
        run: npm run test:auth:setup

      - name: 🛡️ Verify Session Health Precondition
        id: auth_health
        run: npm run test:health

      - name: 🧹 Establish Deterministic Cart Baseline
        id: cart_reset
        run: npm run cart:reset

      - name: 🚀 Run Smoke Regression Suite (Pixel 5 — 393x851)
        id: smoke_run
        run: npm run test:smoke

      - name: 📊 Generate CI Summary & Job Summary
        if: always()
        run: npm run test:summary "Smoke Tier (Every 2h)"

      - name: 📦 Upload Smoke Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts-run-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            reports/
            test-results/
            screenshots/failures/
            videos/
          retention-days: 14
          if-no-files-found: warn
